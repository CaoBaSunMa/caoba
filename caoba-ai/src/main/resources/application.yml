server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/caoba_ai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

jwt:
  secret: caoba-ai-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000        # 24h
  refresh-expiration: 604800000 # 7d

logging:
  level:
    iam.caoba: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
